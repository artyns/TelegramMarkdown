<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Markdown Editor</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}


.toolbar{

    display:flex;
    gap:6px;
    padding:10px;

    overflow-x:auto;
    white-space:nowrap;

    background:#181818;
}


.toolbar button{

    flex-shrink:0;

    padding:10px 14px;

    border:none;
    border-radius:8px;

    background:#333;
    color:white;

    font-size:15px;

}


.editor-container{

    padding:10px;

}


textarea{

    width:100%;

    height:70vh;

    resize:none;

    background:#222;

    color:white;

    border:1px solid #444;

    border-radius:12px;

    padding:15px;

    font-size:16px;

    line-height:1.6;

}


.send{

    width:calc(100% - 20px);

    margin:10px;

    padding:14px;

    border:0;

    border-radius:12px;

    background:#0088cc;

    color:white;

    font-size:18px;

}


</style>

</head>


<body>


<div class="toolbar">


<button onclick="insert('**متن بولد**')">
B
</button>


<button onclick="insert('*متن ایتالیک*')">
I
</button>


<button onclick="insert('`code`')">
Code
</button>


<button onclick="insert('# عنوان')">
H1
</button>


<button onclick="insert('## عنوان دوم')">
H2
</button>


<button onclick="insert('- آیتم')">
List
</button>


<button onclick="insert('> نقل قول')">
Quote
</button>


<button onclick="insert('[متن](لینک)')">
Link
</button>


<button onclick="insert(`| ستون ۱ | ستون ۲ |
|---|---|
| مقدار | مقدار |`)">
Table
</button>


</div>



<div class="editor-container">

<textarea id="editor"
placeholder="Markdown بنویسید..."></textarea>

</div>



<button class="send" onclick="send()">
ارسال
</button>




<script>


// باز شدن کامل WebApp تلگرام

if(window.Telegram && Telegram.WebApp){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

}



function insert(text){


let box=document.getElementById("editor");


let start=box.selectionStart;

let end=box.selectionEnd;


let value=box.value;


box.value =
value.substring(0,start)
+
text
+
value.substring(end);


box.focus();


box.selectionStart =
box.selectionEnd =
start + text.length;


}



function send(){


let text =
document.getElementById("editor").value;



if(!window.Telegram || !Telegram.WebApp){

    alert("این صفحه داخل تلگرام باز نشده");

    return;

}



Telegram.WebApp.sendData(

JSON.stringify({

    type:"markdown",

    text:text

})

);



}


</script>


</body>

</html>
