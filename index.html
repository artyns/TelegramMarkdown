<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Markdown Editor</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    background:
    linear-gradient(135deg,#111827,#1e1b4b);

    color:white;

    font-family:Arial,sans-serif;

}


/* Toolbar */

.toolbar{

    display:flex;

    gap:8px;

    padding:12px;

    overflow-x:auto;

    background:rgba(0,0,0,0.3);

    backdrop-filter:blur(10px);

}


.toolbar button{

    flex-shrink:0;

    padding:10px 16px;

    border:none;

    border-radius:12px;

    background:#374151;

    color:white;

    font-size:15px;

}


.toolbar button:active{

    transform:scale(.95);

    background:#6366f1;

}



/* Editor */


.editor-container{

    padding:12px;

}


textarea{

    width:100%;

    height:70vh;

    resize:none;

    background:#111827;

    color:#e5e7eb;

    border:2px solid #374151;

    border-radius:18px;

    padding:18px;

    font-size:16px;

    line-height:1.7;

    outline:none;

}


textarea:focus{

    border-color:#6366f1;

}



/* Send */


.send{

    width:calc(100% - 24px);

    margin:12px;

    padding:16px;

    border:0;

    border-radius:16px;

    background:

    linear-gradient(135deg,#6366f1,#8b5cf6);

    color:white;

    font-size:18px;

    font-weight:bold;

}



.send:active{

    transform:scale(.97);

}



</style>


</head>



<body>



<div class="toolbar">


<button onclick="insert('**متن بولد**')">
B
</button>


<button onclick="insert('*متن ایتالیک*')">
I
</button>


<button onclick="insert('`code`')">
Code
</button>


<button onclick="insert('# عنوان')">
H1
</button>


<button onclick="insert('## عنوان دوم')">
H2
</button>


<button onclick="insert('- آیتم')">
List
</button>


<button onclick="insert('> نقل قول')">
Quote
</button>


<button onclick="insert('[متن](لینک)')">
Link
</button>


<button onclick="insert(`| عنوان | مقدار |
|---|---|
| متن | متن |`)">
Table
</button>


</div>



<div class="editor-container">

<textarea id="editor"
placeholder="Markdown بنویسید..."></textarea>

</div>



<button class="send" onclick="send()">
🚀 ارسال
</button>




<script>


if(window.Telegram && Telegram.WebApp){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

}




function insert(text){


    let box =
    document.getElementById("editor");


    let start =
    box.selectionStart;


    let end =
    box.selectionEnd;


    let value =
    box.value;


    box.value =
    value.substring(0,start)
    +
    text
    +
    value.substring(end);



    box.focus();


    box.selectionStart =
    box.selectionEnd =
    start + text.length;


}




function send(){


    alert("دکمه ارسال زده شد ✅");



    if(!window.Telegram || !Telegram.WebApp){

        alert("این صفحه داخل تلگرام باز نشده ❌");

        return;

    }



    let text =
    document.getElementById("editor").value;



    Telegram.WebApp.sendData(

        JSON.stringify({

            type:"markdown",

            text:text

        })

    );



    alert("ارسال شد 🚀");


}



</script>



</body>

</html>
